name: Import paper figures (one-off)

# One-off: fetch Fig. 1 of two papers from Sichen Tao's homepage repository (pinned commit), resize them
# with the same settings as the local copies, commit them to scripts/assets/img/pubs/ and redeploy.
# Delete this file once it has run.
on:
  push:
    branches: [main]
    paths: [".github/workflows/import-figures.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p /tmp/img && npm install --prefix /tmp/img --no-save --no-package-lock sharp@0.34.5
      - run: |
          cat > /tmp/img/import.mjs <<'EOF'
          import sharp from "sharp";
          const src = "https://raw.githubusercontent.com/SichenTao/academic-homepage/8a21c84f6993b6c37501a8618ddd21632d9a5ed0/assets/img/publication_preview/";
          const out = `${process.env.GITHUB_WORKSPACE}/scripts/assets/img/pubs/`;
          const get = async (f) => {
            const res = await fetch(src + f);
            if (!res.ok) throw new Error(`${f}: HTTP ${res.status}`);
            return Buffer.from(await res.arrayBuffer());
          };
          await sharp(await get("human-centric-assembly-fig1.jpg")).resize({ width: 480 }).png({ palette: true, colors: 64, effort: 10, compressionLevel: 9 }).toFile(out + "zhao2025humancentric.png");
          await sharp(await get("artificial-visual-system-color-fig1.jpg")).resize({ width: 480 }).jpeg({ quality: 72, mozjpeg: true }).toFile(out + "tao2024novel.jpg");
          EOF
          node /tmp/img/import.mjs
          ls -l scripts/assets/img/pubs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/assets/img/pubs
          git commit -m "Add Fig. 1 thumbnails from Sichen Tao's homepage (resized)"
          git pull --rebase --quiet origin main
          git push

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so redeploy explicitly.
  deploy:
    needs: import
    uses: ./.github/workflows/deploy.yml
