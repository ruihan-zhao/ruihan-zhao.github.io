# venues.yml — 期刊/会议元数据。
# 指标规则（与 Sichen Tao 主页一致）：按论文发表年份取“当年或最近一次已核验”的指标，每个数值标注自身年份。
#   metrics[].for_years 列出适用的论文发表年份；没有匹配项的论文只显示引用数（如会议论文、早期论文）。
#   cas（中科院分区）只作记录，页面不逐篇显示。
# 数据来源：SichenTao/academic-homepage 的逐篇核验记录（2026-08-31）；本人确认按此口径展示（2026-09-26）。
metrics_source: "SichenTao/academic-homepage verification records (checked 2026-08-31); adopted by the author on 2026-09-26"

rcim:
  name: Robotics and Computer-Integrated Manufacturing
  abbr: RCIM
  kind: journal
  publisher: Elsevier
  issn: 0736-5845
  url: https://www.sciencedirect.com/journal/robotics-and-computer-integrated-manufacturing
  metrics:
    - for_years: [2025]
      jcr: { quartile: Q1, year: 2025 }
