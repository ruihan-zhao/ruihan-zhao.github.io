research:
  summary:
    en: >-
      I work on human–robot collaborative (HRC) assembly, focusing on adaptive task allocation and
      planning that jointly accounts for safety, efficiency, and human factors. My methods combine
      multi-objective evolutionary optimization, reinforcement self-learning, and fuzzy clustering to
      plan resources and tasks in shared human–robot assembly systems. I also work on differential
      evolution algorithm design and benchmark-driven numerical optimization, with applications such
      as wind farm layout optimization.
    zh: "我的研究方向是人机协作（HRC）装配，重点关注兼顾安全、效率与人因的自适应任务分配与规划。我结合多目标进化优化、强化自学习与模糊聚类等方法，研究共享人机装配系统中的资源与任务协同规划。此外，我也从事差分进化算法设计与基准驱动的数值优化研究，应用包括风电场布局优化。"
  themes:
    - id: hrc
      en: Human–robot collaborative assembly planning
      zh: 人机协作装配任务分配与规划
      keywords: [task allocation, assembly planning, safety–efficiency, human-centric manufacturing, product family formation]
    - id: ec
      en: Evolutionary computation and differential evolution
      zh: 进化计算与差分进化算法
      keywords: [differential evolution, multi-objective optimization, constrained optimization, wind farm layout optimization]
    - id: vision
      en: Bio-inspired artificial visual systems (co-authored)
      zh: 仿生人工视觉系统（合作）
      keywords: [motion direction detection, retinal direction selectivity]
    - id: health
      en: AI for healthcare (co-authored)
      zh: 医疗人工智能（合作）
      keywords: [mortality risk prediction, VA-ECMO]
    - id: early
      en: Machine tools, fluid power and control (early work)
      zh: 机床、液压与控制（早期工作）
      keywords: [quality management KPI, turn-milling machine tool accuracy, hydraulic transformers, robust control, fuzzy control]

# 首页简介（本人口吻草稿，可直接改写）。{pubs} 会替换为论文页链接。
bio:
  en:
    - >-
      Since January 2026, I have been a Lecturer at the Sino-German College of Applied Sciences (CDHAW),
      Tongji University. I received my Ph.D. from Tongji University in 2025 and my master's degree from
      Tongji's Sino-German School for Postgraduate Studies in 2021, both advised by Pengzhong Li. In 2024, I was a
      visiting Ph.D. student (joint doctoral training) at the Professorship of Autonomous Vehicle
      Systems (AVS), Technical University of Munich, hosted by Prof. Johannes Betz.
    - "@research"
    - >-
      I was part of the RDEx team that won first place in all four numerical optimization tracks of the
      IEEE CEC 2025 competitions, and of the RDE team that received a silver award at IEEE WCCI 2024.
      Recent first-author papers appear in Applied Soft Computing, Advanced Engineering Informatics,
      and Robotics and Computer-Integrated Manufacturing; the full record is on the {pubs}.
  zh:
    - "我自 2026 年 1 月起任同济大学中德工程学院讲师。2025 年在同济大学获博士学位，2021 年在同济大学中德学院获硕士学位，导师均为李鹏忠。2024 年在慕尼黑工业大学 Autonomous Vehicle Systems（AVS）教席联合培养，合作导师为 Johannes Betz 教授。"
    - "@research"
    - "我是 RDEx 团队成员，该团队获 IEEE CEC 2025 数值优化竞赛四个赛道全部第一；也是 RDE 团队成员，获 IEEE WCCI 2024 数值优化竞赛银奖。近期一作论文发表于 Applied Soft Computing、Advanced Engineering Informatics 和 Robotics and Computer-Integrated Manufacturing，完整列表见{pubs}。"

